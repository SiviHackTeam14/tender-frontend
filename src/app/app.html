<div class="app-shell">
	<header class="app-shell__header">
		<div class="app-shell__brand-group">
			<div class="app-shell__brand-mark">T</div>
			<div class="app-shell__brand-copy">
				<span class="app-shell__brand-name">T.O.P.</span>
			</div>
			<div class="app-shell__divider" aria-hidden="true"></div>
			<div class="app-shell__status-pill">
				<span class="app-shell__status-dot"></span>
				<span>VOB/A 2024 Engine Active</span>
			</div>
		</div>

		<div class="app-shell__header-actions">
			<div class="app-shell__profile-chip">
				<span class="material-symbols-outlined">corporate_fare</span>
				<span class="app-shell__profile-name">{{ activeProfile()?.name ?? 'No profile selected' }}</span>
				<span class="material-symbols-outlined app-shell__chevron">expand_more</span>
			</div>
			<button type="button" class="app-shell__icon-button" aria-label="Notifications">
				<span class="material-symbols-outlined">notifications</span>
			</button>
			<button type="button" class="app-shell__icon-button" aria-label="Preferences">
				<span class="material-symbols-outlined">tune</span>
			</button>
		</div>
	</header>

	<aside class="app-shell__sidebar">
		<div class="app-shell__sidebar-group">
			<div class="app-shell__sidebar-kicker">Workspace Scope</div>
			<nav class="app-shell__nav">
				<a
					routerLink="/"
					routerLinkActive="is-active"
					[routerLinkActiveOptions]="{ exact: true }"
					class="app-shell__nav-link"
				>
					<span class="material-symbols-outlined">manage_accounts</span>
					<span>Tender profiles</span>
				</a>
			</nav>
		</div>
	</aside>

	<div class="app-shell__content">
		<main class="app-shell__main">
			<router-outlet />
		</main>
	</div>
</div>
